    </filter>
  </defs>
  <circle cx="16" cy="16" r="14" fill="url(#sphereGradient)" filter="url(#glow)" />
  <circle cx="16" cy="16" r="10" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.3" />
  <path d="M16 8 A1 1 0 0 1 16 24 A1 1 0 0 1 16 8" fill="none" stroke="white" stroke-width="1" stroke-opacity="0.5" filter="url(#glow)" />
